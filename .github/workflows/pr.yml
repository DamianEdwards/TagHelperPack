name: PRs

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

  workflow_dispatch:
    inputs:
      benchmarkMt:
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test PR
    uses: ./.github/workflows/_build.yml
    with:
      benchmarkMt: ${{ inputs.benchmarkMt || false }}
      packShipCandidate: true
