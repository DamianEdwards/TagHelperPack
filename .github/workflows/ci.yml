name: CI (main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    uses: ./.github/workflows/_build.yml
    with:
      packShipCandidate: true

  deploy:
    name: Deploy NuGet package to repo artifacts & sample site to Azure
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - name: Add GitHub Package Repository source
        run: dotnet nuget add source --username ${{ secrets.GPR_USERNAME }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name GPR ${{ secrets.GPR_URI }}

      - name: Push to GitHub Packages
        run: dotnet nuget push **/ci/*.nupkg -s "GPR" --skip-duplicate

      - name: Delete old packages
        uses: smartsquaregmbh/delete-old-packages@53e0b59f56449a9fdbcec8dcc6d1b038b8a29992 # v0.5.0
        with:
          keep: 5
          names: TagHelperPack

      # Deploy to Azure Web apps
      - name: Deploy sample site to Azure
        uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "**/samplesite"
