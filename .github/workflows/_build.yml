name: Build

on:
  workflow_call:
    inputs:
      versionSuffix:
        required: false
        type: string
        default: ci
      packShipCandidate:
        required: false
        type: boolean
        default: false

env:
  SAMPLE_PATH: ./samples/TagHelperPack.Sample/TagHelperPack.Sample.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build package & sample site

    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    
    - name: Install .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: global.json
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Create build number
      run: |
        now=$(date +'%Y%m%d')
        buildNumber=$now.$GITHUB_RUN_NUMBER
        echo "BUILD_NUMBER=$buildNumber" >> $GITHUB_ENV
        echo "$buildNumber"

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:BuildNumber=$BUILD_NUMBER -p:SourceRevisionId=$GITHUB_SHA -p:ContinuousIntegrationBuild=true

    - name: Test
      run: dotnet test --configuration Release --no-restore --no-build

    - name: Publish sample (net10.0)
      run: dotnet publish $SAMPLE_PATH --output artifacts/samplesite --framework net10.0 --runtime linux-x64 --self-contained --configuration Release --verbosity normal

    - name: Smoke test published sample
      run: |
        cd artifacts/samplesite
        site_log=$(mktemp)
        response=$(mktemp)
        ASPNETCORE_ENVIRONMENT=Production ./TagHelperPack.Sample --urls http://127.0.0.1:5057 > "$site_log" 2>&1 &
        site_pid=$!
        trap 'kill "$site_pid"; cat "$site_log"; rm "$site_log" "$response"' EXIT
        curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5057/ > "$response"
        grep -F 'on .NET 10.' "$response"
        grep -F '<div>This will only render when the user is <strong>*not*</strong> authenticated.</div>' "$response"
        curl --fail --silent --show-error 'http://127.0.0.1:5057/?auth=std' > "$response"
        grep -F '<div>This will only render if the user is authenticated.</div>' "$response"
        if grep -F '<div>This will only render if the user is authenticated and authorized via the "AdminPolicy" policy.</div>' "$response"; then
          echo "Standard users must not see admin content"
          exit 1
        fi
        curl --fail --silent --show-error 'http://127.0.0.1:5057/?auth=admin' > "$response"
        grep -F '<div>This will only render if the user is authenticated and authorized via the "AdminPolicy" policy.</div>' "$response"
        curl --fail --silent --show-error http://127.0.0.1:5057/css/site.css > /dev/null
      
    - name: Pack (ci)
      run: dotnet pack --configuration Release --output artifacts/ci --verbosity normal -p:BuildNumber=$BUILD_NUMBER -p:SourceRevisionId=$GITHUB_SHA -p:ContinuousIntegrationBuild=true

    - name: Pack (ship candidate)
      if: ${{ inputs.packShipCandidate }}
      run: dotnet pack --configuration Release --output artifacts/ship --verbosity normal -p:BuildNumber=$BUILD_NUMBER -p:SourceRevisionId=$GITHUB_SHA -p:ContinuousIntegrationBuild=true -p:IsShipCandidate=true

    - name: Upload artifacts (packages)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nupkg
        path: artifacts/**/*.nupkg
        retention-days: 5
    
    - name: Upload artifacts (sample site)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: samplesite
        path: artifacts/samplesite
        retention-days: 5
